<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center - AutoPro Car Care</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6.5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Base & Premium Theme CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/premium.css">
    
    <!-- React 18, ReactDOM 18 & Babel Standalone CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Shared Store -->
    <script src="assets/js/shared-store.js"></script>
</head>
<body>

    <div id="admin-root">
        <!-- Pre-hydration loader -->
        <div class="d-flex flex-column align-items-center justify-content-center min-vh-100" style="background-color: #f8fafc; color: #0f172a;">
            <div class="spinner-grow mb-3" style="width: 3rem; height: 3rem; color: #590907;" role="status"></div>
            <h3 class="fw-bold brand-logo">AUTO<span style="color: #590907;">PRO</span></h3>
            <p class="text-muted small">Loading Enterprise Dispatch & Admin Controller...</p>
        </div>
    </div>

    <!-- Bootstrap 5.3 Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- React Admin App -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function AdminCommandApp() {
            const [bookings, setBookings] = useState(loadBookings);
            const [employees, setEmployees] = useState(INITIAL_EMPLOYEES);
            const [adminTab, setAdminTab] = useState('dispatch'); // 'dispatch', 'workforce', 'services', 'analytics'
            const [searchQuery, setSearchQuery] = useState('');
            const [statusFilter, setStatusFilter] = useState('All');
            const [toast, setToast] = useState(null);

            // Sync with other tabs
            useEffect(() => {
                const handleSync = () => setBookings(loadBookings());
                window.addEventListener('autopro_storage_change', handleSync);
                window.addEventListener('storage', handleSync);
                return () => {
                    window.removeEventListener('autopro_storage_change', handleSync);
                    window.removeEventListener('storage', handleSync);
                };
            }, []);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3500);
            };

            // Admin Status Override
            const handleStatusOverride = (bookingNum, newStatus) => {
                const stepIdx = STATUS_PIPELINE.indexOf(newStatus) + 1;
                const updated = bookings.map(b => {
                    if (b.number === bookingNum) {
                        return {
                            ...b,
                            status: newStatus,
                            stepIndex: stepIdx,
                            remarks: `Status updated to ${newStatus} by Enterprise Administrator.`,
                            paymentStatus: newStatus === 'Delivered' ? 'Paid' : b.paymentStatus
                        };
                    }
                    return b;
                });
                setBookings(updated);
                saveBookings(updated);
                showToast(`Admin updated ${bookingNum} status to ${newStatus}`);
            };

            // Payment status toggle
            const handleTogglePayment = (bookingNum) => {
                const updated = bookings.map(b => {
                    if (b.number === bookingNum) {
                        const next = b.paymentStatus === 'Paid' ? 'Unpaid' : 'Paid';
                        return { ...b, paymentStatus: next };
                    }
                    return b;
                });
                setBookings(updated);
                saveBookings(updated);
                showToast(`Payment status toggled for ${bookingNum}`);
            };

            // Reset to factory seed data
            const handleResetSeedData = () => {
                if (window.confirm('Reset bookings and vehicles to canonical factory seed data?')) {
                    localStorage.removeItem('autopro_bookings');
                    localStorage.removeItem('autopro_vehicles');
                    setBookings(INITIAL_BOOKINGS);
                    saveBookings(INITIAL_BOOKINGS);
                    saveVehicles(INITIAL_VEHICLES);
                    showToast('Platform reset to initial seed data.');
                }
            };

            // Metrics
            const totalRevenue = useMemo(() => {
                return bookings.filter(b => b.paymentStatus === 'Paid').reduce((a, c) => a + c.total, 0);
            }, [bookings]);

            const activeJobsCount = useMemo(() => {
                return bookings.filter(b => b.status !== 'Delivered').length;
            }, [bookings]);

            const completedJobsCount = useMemo(() => {
                return bookings.filter(b => b.status === 'Delivered').length;
            }, [bookings]);

            // Filtered bookings
            const filteredBookings = useMemo(() => {
                return bookings.filter(b => {
                    const matchQ = !searchQuery || 
                        b.number.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        b.car.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        b.reg.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        b.customer.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchStatus = statusFilter === 'All' || b.status === statusFilter;
                    return matchQ && matchStatus;
                });
            }, [bookings, searchQuery, statusFilter]);

            return (
                <div className="min-vh-100 d-flex flex-column">
                    {/* Toast Notification */}
                    {toast && (
                        <div className="position-fixed bottom-0 end-0 p-3" style={{ zIndex: 9999 }}>
                            <div className="toast show align-items-center shadow-lg p-2 rounded glass-panel">
                                <div className="d-flex align-items-center">
                                    <i className="fa-solid fa-circle-check text-accent fs-5 me-2 ms-2"></i>
                                    <div className="toast-body fw-bold theme-text-main">{toast}</div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Top Utility Bar */}
                    <div className="top-bar-custom py-2">
                        <div className="container d-flex flex-wrap justify-content-between align-items-center gap-2">
                            <div>
                                <span className="me-3">
                                    <i className="fa-solid fa-server text-accent me-1"></i> Enterprise Cluster: <strong>US-EAST-CLOUD-01</strong>
                                </span>
                                <span className="theme-text-muted d-none d-md-inline">
                                    <i className="fa-solid fa-shield-halved text-accent me-1"></i> Full Root Dispatch Privileges Active
                                </span>
                            </div>

                            <div className="d-flex align-items-center gap-3">
                                <span className="badge px-3 py-1 text-white d-inline-flex align-items-center" style={{ backgroundColor: '#590907', letterSpacing: '0.5px', fontSize: '0.75rem', borderRadius: '20px' }}>
                                    <i className="fa-solid fa-shield-halved me-1"></i> Admin Dispatcher (ADM-001)
                                </span>
                            </div>
                        </div>
                    </div>

                    {/* Navigation Header */}
                    <nav className="premium-nav sticky-top">
                        <div className="container d-flex justify-content-between align-items-center">
                            <a href="index.html" className="brand-logo text-decoration-none d-flex align-items-center">
                                <i className="fa-solid fa-car-tunnel me-2 text-accent"></i>AUTO<span>PRO</span>
                            </a>

                            <div className="d-none d-md-flex align-items-center gap-4">
                                <a href="index.html" className="nav-link-custom">Home</a>
                                <a href="customer.html" className="nav-link-custom">Customer Portal</a>
                                <a href="employee.html" className="nav-link-custom">Employee Portal</a>
                                <a href="admin.html" className="nav-link-custom active fw-bold text-accent">Admin Command</a>
                            </div>

                            <div className="d-flex align-items-center gap-2">
                                <button className="btn-glass btn-sm" onClick={handleResetSeedData}>
                                    <i className="fa-solid fa-rotate-left text-accent me-1"></i>Reset Demo
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* Admin Hero Header */}
                    <div className="section-alt py-4 border-bottom border-subtle">
                        <div className="container">
                            <div className="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                                <div>
                                    <div className="hero-tag mb-2">
                                        <i className="fa-solid fa-satellite-dish me-1"></i> Central Operations Control
                                    </div>
                                    <h2 className="fw-bold fs-2 mb-1">Enterprise Dispatcher & Operations Command</h2>
                                    <p className="theme-text-muted mb-0">Full control over 12-stage vehicle dispatch, workforce routing, invoice settlements, and master services.</p>
                                </div>
                                <div className="d-flex gap-2">
                                    <span className="badge bg-success bg-opacity-10 text-success border border-success p-2 px-3 fs-6 d-inline-flex align-items-center">
                                        <i className="fa-solid fa-circle-dot fa-beat me-2"></i>Live 12-Stage Pipeline Active
                                    </span>
                                </div>
                            </div>

                            {/* 4 Executive KPIs */}
                            <div className="row g-3 mt-3">
                                <div className="col-6 col-md-3">
                                    <div className="kpi-card text-center">
                                        <div className="text-accent fw-bold fs-3 display-font">₹ {totalRevenue.toLocaleString()}</div>
                                        <div className="theme-text-muted small text-uppercase">Total Settled Revenue</div>
                                    </div>
                                </div>
                                <div className="col-6 col-md-3">
                                    <div className="kpi-card text-center">
                                        <div className="text-warning fw-bold fs-3 display-font">{activeJobsCount}</div>
                                        <div className="theme-text-muted small text-uppercase">Active In Workshop</div>
                                    </div>
                                </div>
                                <div className="col-6 col-md-3">
                                    <div className="kpi-card text-center">
                                        <div className="text-success fw-bold fs-3 display-font">{completedJobsCount}</div>
                                        <div className="theme-text-muted small text-uppercase">Delivered Jobs</div>
                                    </div>
                                </div>
                                <div className="col-6 col-md-3">
                                    <div className="kpi-card text-center">
                                        <div className="theme-text-main fw-bold fs-3 display-font">{employees.length}</div>
                                        <div className="theme-text-muted small text-uppercase">Field & Bay Crew</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Admin Navigation Tabs */}
                    <div className="container py-4">
                        <div className="d-flex flex-wrap gap-2 mb-4 pb-2 border-bottom border-subtle">
                            <button className={`btn btn-sm ${adminTab === 'dispatch' ? 'btn-accent' : 'btn-glass'}`} onClick={() => setAdminTab('dispatch')}>
                                <i className="fa-solid fa-list-check me-1"></i>12-Stage Booking Dispatch ({bookings.length})
                            </button>
                            <button className={`btn btn-sm ${adminTab === 'workforce' ? 'btn-accent' : 'btn-glass'}`} onClick={() => setAdminTab('workforce')}>
                                <i className="fa-solid fa-users-gear me-1"></i>Workforce & Crew ({employees.length})
                            </button>
                            <button className={`btn btn-sm ${adminTab === 'services' ? 'btn-accent' : 'btn-glass'}`} onClick={() => setAdminTab('services')}>
                                <i className="fa-solid fa-screwdriver-wrench me-1"></i>Service Catalog (10)
                            </button>
                        </div>

                        {/* TAB 1: 12-STAGE DISPATCH CONTROLLER */}
                        {adminTab === 'dispatch' && (
                            <div>
                                {/* Search & Status Filter Controls */}
                                <div className="row g-2 mb-3 align-items-center">
                                    <div className="col-md-6">
                                        <div className="input-group">
                                            <span className="input-group-text bg-surface border-subtle text-accent"><i className="fa-solid fa-magnifying-glass"></i></span>
                                            <input
                                                type="text"
                                                className="luxury-input w-100"
                                                placeholder="Search by Booking Ref, Car, Reg Plate, or Customer..."
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                            />
                                        </div>
                                    </div>
                                    <div className="col-md-6 d-flex justify-content-md-end gap-2">
                                        <select
                                            className="luxury-input small"
                                            value={statusFilter}
                                            onChange={(e) => setStatusFilter(e.target.value)}
                                        >
                                            <option value="All">All Statuses ({bookings.length})</option>
                                            {STATUS_PIPELINE.map(st => (
                                                <option key={st} value={st}>{st}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                <div className="glass-panel p-4">
                                    <div className="table-responsive">
                                        <table className="table table-custom">
                                            <thead>
                                                <tr>
                                                    <th>Ref</th>
                                                    <th>Customer & Car</th>
                                                    <th>Assigned Crew</th>
                                                    <th>Current Status</th>
                                                    <th>Admin Override Status</th>
                                                    <th>Total (₹)</th>
                                                    <th>Payment</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {filteredBookings.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="7" className="text-center py-4 theme-text-muted">
                                                            No bookings matching current filter.
                                                        </td>
                                                    </tr>
                                                ) : (
                                                    filteredBookings.map(b => (
                                                        <tr key={b.number}>
                                                            <td>
                                                                <strong className="text-accent">{b.number}</strong>
                                                                <small className="d-block theme-text-muted">{b.date || 'Today'}</small>
                                                            </td>
                                                            <td>
                                                                <div className="fw-bold">{b.customer}</div>
                                                                <small className="theme-text-muted">{b.car} ({b.reg})</small>
                                                            </td>
                                                            <td>
                                                                <div className="small">
                                                                    <div><i className="fa-solid fa-truck-pickup text-accent me-1"></i>{b.driver.split('(')[0]}</div>
                                                                    <div><i className="fa-solid fa-wrench text-accent me-1"></i>{b.tech.split('(')[0]}</div>
                                                                </div>
                                                            </td>
                                                            <td>
                                                                <span className={`badge bg-${b.status === 'Delivered' ? 'success' : 'warning bg-opacity-25 text-warning border border-warning'}`}>
                                                                    {b.status}
                                                                </span>
                                                            </td>
                                                            <td>
                                                                <select
                                                                    className="luxury-input py-1 px-2 small"
                                                                    value={b.status}
                                                                    onChange={(e) => handleStatusOverride(b.number, e.target.value)}
                                                                >
                                                                    {STATUS_PIPELINE.map(st => (
                                                                        <option key={st} value={st}>{st}</option>
                                                                    ))}
                                                                </select>
                                                            </td>
                                                            <td className="fw-bold">
                                                                ₹ {b.total.toFixed(2)}
                                                            </td>
                                                            <td>
                                                                <button
                                                                    className={`btn btn-sm py-1 px-2 ${b.paymentStatus === 'Paid' ? 'btn-success' : 'btn-outline-danger'}`}
                                                                    onClick={() => handleTogglePayment(b.number)}
                                                                    title="Click to toggle Payment Status"
                                                                >
                                                                    {b.paymentStatus}
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: WORKFORCE & CREW */}
                        {adminTab === 'workforce' && (
                            <div>
                                <h4 className="fw-bold mb-3">Field Logistics & Workshop Bay Crew</h4>
                                <div className="row g-4">
                                    {employees.map(emp => (
                                        <div key={emp.id} className="col-md-6 col-lg-3">
                                            <div className="glass-panel p-4 h-100">
                                                <div className="service-icon-box mb-3">
                                                    <i className={`fa-solid ${emp.role.includes('Pickup') ? 'fa-truck-pickup' : 'fa-user-gear'}`}></i>
                                                </div>
                                                <h5 className="fw-bold mb-1">{emp.name}</h5>
                                                <span className="badge badge-accent mb-2">{emp.id}</span>
                                                <div className="small theme-text-muted mb-3">
                                                    <div>Role: <strong className="theme-text-main">{emp.role}</strong></div>
                                                    <div>Phone: <strong className="theme-text-main">{emp.phone}</strong></div>
                                                    <div>Current Status: <strong className="text-success">{emp.status}</strong></div>
                                                    <div>Active Route: <strong className="theme-text-main">{emp.activeJob}</strong></div>
                                                </div>
                                                <button className="btn btn-sm btn-glass w-100" onClick={() => showToast(`Dispatch call placed to ${emp.name}`)}>
                                                    <i className="fa-solid fa-phone me-1"></i>Contact Staff
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB 3: SERVICES CATALOG */}
                        {adminTab === 'services' && (
                            <div>
                                <h4 className="fw-bold mb-3">Master Service Catalog (10 Offerings)</h4>
                                <div className="glass-panel p-4">
                                    <div className="table-responsive">
                                        <table className="table table-custom">
                                            <thead>
                                                <tr>
                                                    <th>ID</th>
                                                    <th>Service Name</th>
                                                    <th>Category</th>
                                                    <th>Duration</th>
                                                    <th>Standard Base Price</th>
                                                    <th>Badge</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {INITIAL_SERVICES.map(s => (
                                                    <tr key={s.id}>
                                                        <td><strong>#{s.id}</strong></td>
                                                        <td className="fw-bold">{s.name}</td>
                                                        <td><span className="badge bg-surface border border-subtle theme-text-main">{s.category}</span></td>
                                                        <td>{s.duration}</td>
                                                        <td className="fw-bold text-accent">₹ {s.price.toLocaleString()}</td>
                                                        <td><span className="badge badge-accent">{s.badge}</span></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>

                    {/* Footer */}
                    <footer className="site-footer mt-auto">
                        <div className="container">
                            <div className="d-flex flex-wrap justify-content-between small theme-text-muted">
                                <span>&copy; 2026 AutoPro Car Care Platform. Admin Command Center.</span>
                                <span>Master Administrator Session Active</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('admin-root'));
        root.render(<AdminCommandApp />);
    </script>
</body>
</html>
